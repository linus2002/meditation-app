name: Android test APK

on:
  workflow_dispatch:

permissions:
  contents: write # to update the test-build release

concurrency:
  group: android-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Public build-time values, read from repo Variables. They end up inside the
      # APK, where anyone can read them, so none of them may be a secret.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPPORT_TRACK: ${{ vars.NEXT_PUBLIC_SUPPORT_TRACK }}
      # PostHog's project key is public by design (phc_...); without it the APK sends no analytics.
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
    steps:
      # With the permanent key (MOBILE.md, "Signing") every build updates the
      # last one in place. Without it the APK is signed with a throwaway key
      # made fresh on this runner, so it cannot update an earlier build: testers
      # must uninstall first, which erases what was kept only on the phone.
      - name: Check for the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FINGERPRINT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          missing=""
          for name in KEYSTORE PASSWORD ALIAS FINGERPRINT; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "permanent=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" = " KEYSTORE PASSWORD ALIAS FINGERPRINT" ]; then
            echo "permanent=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing key set: this APK has a throwaway key and cannot update an earlier test build. Testers must uninstall first, losing data kept only on the phone. See MOBILE.md, Signing."
          else
            # Half set up is a mistake, not a choice: say which are missing.
            echo "::error::Android signing is only partly set up (missing:$missing). See MOBILE.md, Signing."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 / Android Gradle Plugin need Java 21. The Android SDK is already on the runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci
        env:
          # onnxruntime-node (via kokoro-js, used only by the local narration
          # script) fetches CUDA binaries on Linux x64 at install time, and that
          # download 404s. The APK build never runs it, so skip the GPU extras.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      # The static export (MOBILE_BUILD=1) into out/, not the server build.
      - name: Build the web app
        run: npm run build:mobile

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build and sign the APK
        working-directory: android
        env:
          PERMANENT: ${{ steps.signing.outputs.permanent }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/serenity.jks
          SERENITY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SERENITY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$PERMANENT" = "true" ]; then
            export SERENITY_KEYSTORE="$KEYSTORE_FILE"
            trap 'rm -f "$SERENITY_KEYSTORE"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$SERENITY_KEYSTORE"
          else
            # build.gradle then signs the release build with this runner's debug key.
            export SERENITY_THROWAWAY_KEY=1
          fi
          # Rises with every run. Renaming this workflow file restarts run_number: add an offset if you do.
          export SERENITY_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../serenity-test.apk

      - name: Check it carries the permanent key
        if: steps.signing.outputs.permanent == 'true'
        env:
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          expected=$(printf '%s' "$EXPECTED" | tr -d ': \r\n' | tr 'A-F' 'a-f')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Signed with a different key from ANDROID_CERT_SHA256. Not publishing: installed copies could not update."
            exit 1
          fi

      - name: Publish to the test-build release
        env:
          GH_TOKEN: ${{ github.token }}
          PERMANENT: ${{ steps.signing.outputs.permanent }}
        run: |
          notes="Test build of ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). For testing only: install with \"Install unknown apps\"."
          if [ "$PERMANENT" != "true" ]; then
            notes="$notes Uninstall any earlier Serenity test build first: this one cannot update it. Uninstalling erases reflections, sleep logs, mixes, schedules and chats kept on the phone; synced sessions, ratings and likes come back when you sign in."
          fi
          # GitHub's API now and then answers 502/503 for a moment. Try each call
          # up to 5 times, waiting longer each time, before failing the run.
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              [ "$attempt" = 5 ] && return 1
              echo "::warning::'$1 $2 $3' failed (attempt $attempt of 5); retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
          }
          if retry gh release view test-build >/dev/null 2>&1; then
            # The APK first, then the notes, so the notes never name a build
            # that didn't make it up.
            retry gh release upload test-build serenity-test.apk --clobber
            retry gh release edit test-build --notes "$notes" --prerelease
          else
            retry gh release create test-build serenity-test.apk --title "Test build" --notes "$notes" --prerelease
          fi

      - name: Also keep it on the run page
        uses: actions/upload-artifact@v4
        with:
          name: serenity-test-apk
          path: serenity-test.apk
          retention-days: 14
