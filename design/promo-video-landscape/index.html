<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Serenity Promo 16:9</title>
<style>
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-300-normal.woff2') format('woff2'); font-weight: 300; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
  :root { --mist: #F4F5F9; --blue: #1D9FDA; --green: #61A644; --midnight: #181A2E; }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #03050B; font-family: 'Poppins', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #cam { position: absolute; inset: 0; }
  .layer, .scene { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
  .hi { color: #9BE27A; text-shadow: 0 0 28px rgba(97,166,68,0.55); }

  /* logo lockup */
  .lockup { position: absolute; left: 0; top: 0; display: flex; align-items: center; will-change: transform, opacity, filter; }
  .lockup .word { font-weight: 600; letter-spacing: -0.025em; line-height: 1; white-space: nowrap; overflow: hidden; }
  .lockup .word span { display: inline-block; }

  /* phone */
  .pw { position: absolute; left: 0; top: 0; width: 632px; height: 1332px; transform-style: preserve-3d; transform-origin: 50% 50%; }
  .slab { position: absolute; inset: 0; border-radius: 100px; }
  .slab.back { background: linear-gradient(160deg, #2a2d36 0%, #15171d 55%, #22252d 100%); box-shadow: inset 0 0 0 4px #8f939c; overflow: hidden; }
  .back .inner { position: absolute; inset: 0; transform: scaleX(-1); }
  .back .cam { position: absolute; left: 34px; top: 34px; width: 250px; height: 250px; border-radius: 70px; background: linear-gradient(145deg, #30333c, #1a1c22); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08); }
  .back .lens { position: absolute; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a4a66 0%, #0b0d14 55%, #000 70%); box-shadow: 0 0 0 9px #2c2f37, 0 0 0 11px #555a64; }
  .back .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0.9; }
  .front { position: absolute; inset: 0; border-radius: 100px; padding: 5px; box-sizing: border-box; backface-visibility: hidden;
    background: linear-gradient(135deg, #f1f2f5 0%, #8b8e97 18%, #e9eaee 34%, #6f727b 52%, #d8dae0 70%, #7d808a 86%, #eceef2 100%); }
  .bezel { position: absolute; inset: 5px; border-radius: 95px; background: #050507; }
  .screen { position: absolute; left: 11px; top: 11px; width: 600px; height: 1300px; border-radius: 84px; overflow: hidden; background: #000; }
  .status { position: absolute; left: 0; top: 0; width: 600px; height: 63px; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 6px 46px 0 62px; box-sizing: border-box; font-weight: 600; font-size: 24px; color: #fff; }
  .status .icons { display: flex; gap: 9px; align-items: center; }
  .view { position: absolute; inset: 0; }
  .island { position: absolute; left: 50%; top: 26px; width: 176px; height: 50px; margin-left: -88px; border-radius: 26px; background: #000; z-index: 30; overflow: hidden; }
  .glare { position: absolute; inset: 0; border-radius: 100px; pointer-events: none; z-index: 40; mix-blend-mode: screen;
    background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.12) 44%, rgba(255,255,255,0.02) 52%, rgba(255,255,255,0) 60%); background-size: 300% 100%; }
  .btn { position: absolute; width: 8px; border-radius: 4px; background: linear-gradient(90deg, #6e717a, #d9dbe0, #7d808a); }

  /* phone screens */
  .wall { position: absolute; inset: 0; background:
      radial-gradient(ellipse 90% 60% at 20% 15%, rgba(61,189,245,0.95) 0%, rgba(29,159,218,0) 60%),
      radial-gradient(ellipse 80% 55% at 85% 70%, rgba(97,166,68,0.85) 0%, rgba(97,166,68,0) 60%),
      radial-gradient(ellipse 120% 80% at 50% 110%, #0B3A5C 0%, rgba(11,58,92,0) 60%),
      linear-gradient(180deg, #1D9FDA 0%, #12609A 45%, #0B2340 100%); }
  .wall::after { content: ''; position: absolute; left: -30%; top: 38%; width: 160%; height: 70%; border-radius: 50%; border-top: 3px solid rgba(255,255,255,0.35); transform: rotate(-12deg); }
  .lock { position: absolute; inset: 0; z-index: 10; }
  .lock .date { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 500; font-size: 32px; color: rgba(255,255,255,0.92); }
  .lock .time { position: absolute; left: 0; right: 0; top: 182px; text-align: center; font-weight: 600; font-size: 190px; letter-spacing: -0.03em; line-height: 1; color: #fff; }
  .lock .qa { position: absolute; bottom: 70px; width: 96px; height: 96px; border-radius: 50%; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; }
  .lock .bar { position: absolute; bottom: 22px; left: 50%; width: 200px; height: 9px; margin-left: -100px; border-radius: 5px; background: #fff; }
  .home { position: absolute; inset: 0; }
  .widget { position: absolute; top: 104px; width: 255px; height: 255px; border-radius: 52px; box-sizing: border-box; padding: 26px; color: #fff; }
  .app { position: absolute; width: 112px; text-align: center; }
  .app .ic { width: 112px; height: 112px; border-radius: 27px; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 6px 14px rgba(0,0,0,0.18); }
  .app .lb { margin-top: 10px; font-size: 21px; font-weight: 500; color: #fff; white-space: nowrap; }
  .dock { position: absolute; left: 20px; right: 20px; bottom: 26px; height: 150px; border-radius: 56px; background: rgba(255,255,255,0.22); }
  .dots { position: absolute; left: 50%; bottom: 196px; transform: translateX(-50%); display: flex; gap: 12px; padding: 10px 18px; border-radius: 20px; background: rgba(255,255,255,0.18); }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.45); }
  .dots i:first-child { background: #fff; }
  .tapring { position: absolute; width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.95); box-sizing: border-box; opacity: 0; z-index: 25; }
  .np { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; padding: 30px 34px; box-sizing: border-box; }
  .np .row { display: flex; align-items: center; gap: 20px; }
  .np .art { width: 92px; height: 92px; border-radius: 22px; background-size: cover; flex: none; }
  .np .t1 { font-weight: 600; font-size: 31px; line-height: 1.15; }
  .np .t2 { font-weight: 400; font-size: 24px; color: rgba(255,255,255,0.6); }
  .np .wave { margin-left: auto; display: flex; gap: 6px; align-items: center; height: 50px; }
  .np .wave i { width: 6px; border-radius: 3px; background: linear-gradient(180deg, #3DBDF5, #61A644); }
  .np .prog { display: flex; align-items: center; gap: 14px; margin-top: 26px; font-size: 19px; color: rgba(255,255,255,0.6); }
  .np .track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.22); overflow: hidden; }
  .np .track b { display: block; height: 100%; width: 22%; border-radius: 4px; background: #fff; }
  .np .ctl { display: flex; justify-content: center; align-items: center; gap: 64px; margin-top: 20px; }

  /* floating ui */
  .space { position: absolute; inset: 0; perspective: 1500px; perspective-origin: 50% 50%; }
  .world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .node { position: absolute; left: 0; top: 0; will-change: transform, filter, opacity; }
  .chip { display: inline-flex; align-items: center; height: 64px; padding: 0 32px; border-radius: 32px; font-size: 26px; font-weight: 500; color: #fff; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.14); white-space: nowrap; box-sizing: border-box; }
  .chip.on { background: linear-gradient(95deg, #1D9FDA, #61A644); border-color: transparent; }
  .rowcard { width: 560px; height: 132px; border-radius: 26px; background: rgba(20,23,51,0.94); border: 1.5px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 24px; padding: 0 30px 0 18px; box-sizing: border-box; box-shadow: 0 30px 60px rgba(0,0,0,0.45); }
  .rowcard .th { width: 96px; height: 96px; border-radius: 18px; background-size: cover; flex: none; }
  .rowcard .t1 { font-size: 31px; font-weight: 600; white-space: nowrap; }
  .rowcard .t2 { font-size: 21px; color: rgba(255,255,255,0.6); margin-top: 4px; white-space: nowrap; }
  .rowcard .heart { margin-left: auto; }
  .gcard { width: 340px; height: 430px; border-radius: 26px; overflow: hidden; background: #141733; box-shadow: 0 34px 70px rgba(0,0,0,0.5); border: 1.5px solid rgba(255,255,255,0.08); }
  .gcard .hd { height: 92px; display: flex; align-items: center; gap: 14px; padding: 0 18px; box-sizing: border-box; background: rgba(255,255,255,0.10); }
  .gcard .av { width: 52px; height: 52px; border-radius: 50%; background-size: cover; flex: none; border: 2px solid rgba(255,255,255,0.5); }
  .gcard .t1 { font-size: 23px; font-weight: 600; white-space: nowrap; }
  .gcard .t2 { font-size: 17px; color: rgba(255,255,255,0.62); white-space: nowrap; }
  .gcard .im { height: 338px; background-size: cover; background-position: center; }
  .heading { font-size: 44px; font-weight: 600; white-space: nowrap; letter-spacing: -0.01em; }

  /* tagline */
  .tline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 72px; letter-spacing: -0.015em; white-space: nowrap; }
  .tline .w { display: inline-block; will-change: transform, opacity, filter; }

  #grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; background-size: 360px 360px; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 75% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="hblur" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="60 0"/></filter>
</svg>
<div id="stage"><div id="cam"></div></div>
<script src="comp.js"></script>
</body>
</html>
