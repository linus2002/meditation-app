<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="n" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.78  0 0 0 0 1  0 0 0 0.9 -0.32"/>
    </filter>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" fill="#0A1A2E"/>
  <g filter="url(#b)">
    <circle cx="80" cy="640" r="760" fill="#10739A"/>
    <circle cx="80" cy="640" r="700" fill="#1D9FDA"/>
    <circle cx="80" cy="640" r="560" fill="#0F5F86"/>
    <circle cx="80" cy="640" r="470" fill="#1D9FDA"/>
    <circle cx="80" cy="640" r="380" fill="#167FB2"/>
  </g>
  <g filter="url(#b2)" fill="none">
    <circle cx="80" cy="640" r="690" stroke="#040C18" stroke-width="16" opacity="0.9"/>
    <circle cx="80" cy="640" r="555" stroke="#061424" stroke-width="40" opacity="0.7"/>
  </g>
  <rect width="1000" height="360" fill="url(#fade)"/>
  <rect width="1000" height="360" filter="url(#n)"/>
</svg>
