<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="n" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.8  0 0 0 0 1  0 0 0 0.95 -0.3"/>
    </filter>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="400" height="700" fill="#0E5277"/>
  <g filter="url(#b)">
    <circle cx="470" cy="760" r="620" fill="#1D9FDA"/>
    <circle cx="470" cy="760" r="520" fill="#06192A"/>
    <circle cx="470" cy="760" r="470" fill="#1D9FDA"/>
    <circle cx="470" cy="760" r="400" fill="#127CB0"/>
    <circle cx="470" cy="760" r="300" fill="#0A3552"/>
  </g>
  <g filter="url(#b2)" fill="none">
    <circle cx="470" cy="760" r="430" stroke="#020A14" stroke-width="22" opacity="0.85"/>
  </g>
  <rect width="400" height="700" fill="url(#fade)"/>
  <rect width="400" height="700" filter="url(#n)"/>
</svg>
