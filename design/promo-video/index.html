<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Serenity Promo</title>
<style>
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-300-normal.woff2') format('woff2'); font-weight: 300; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-500-normal.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-600-normal.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: 'Poppins'; src: url('/src/assets/fonts/poppins-latin-700-normal.woff2') format('woff2'); font-weight: 700; }

  :root {
    --mist: #F4F5F9;
    --blue: #1D9FDA;
    --green: #61A644;
    --midnight: #181A2E;
    --night: #0A0C1C;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--night);
    font-family: 'Poppins', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #cam { position: absolute; inset: 0; }
  .layer, .scene { position: absolute; inset: 0; }
  .scene { perspective: 2600px; perspective-origin: 50% 45%; }
  .abs { position: absolute; }

  /* background */
  .blob { position: absolute; border-radius: 50%; will-change: transform, opacity; }
  .dot { position: absolute; border-radius: 50%; background: #fff; }
  .star { position: absolute; border-radius: 50%; background: #fff; }

  /* type */
  .hl { position: absolute; font-weight: 600; letter-spacing: -0.025em; line-height: 1.08; white-space: nowrap; }
  .hl .line { display: block; }
  .hl .w { display: inline-block; will-change: transform, opacity, filter; }
  .g .w, .gtext { background: linear-gradient(95deg, #3DBDF5 0%, #1D9FDA 35%, #61A644 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.04em; }
  .sub { position: absolute; font-weight: 400; font-size: 40px; color: rgba(255,255,255,0.86); white-space: nowrap; letter-spacing: 0.005em; }
  .sub .c { display: inline-block; white-space: pre; }
  .eyebrow { position: absolute; font-weight: 500; font-size: 32px; letter-spacing: 0.01em; color: #7FD0F5; white-space: nowrap; display: flex; align-items: center; gap: 22px; }
  .eyebrow .bar { height: 3px; width: 70px; border-radius: 2px; background: linear-gradient(90deg, var(--blue), var(--green)); transform-origin: left center; }

  /* brand */
  #brand { position: absolute; right: 70px; top: 70px; display: flex; align-items: center; gap: 14px; }
  #brand span { font-weight: 600; font-size: 44px; letter-spacing: -0.02em; line-height: 1; margin-top: -6px; }

  /* phone */
  .pw { position: absolute; left: 0; top: 0; width: 632px; height: 1332px; transform-style: preserve-3d; transform-origin: 50% 50%; }
  .slab { position: absolute; inset: 0; border-radius: 100px; backface-visibility: visible; }
  .slab.back { background: linear-gradient(160deg, #2a2d36 0%, #15171d 55%, #22252d 100%); box-shadow: inset 0 0 0 4px #8f939c; overflow: hidden; }
  .back .inner { position: absolute; inset: 0; transform: scaleX(-1); }
  .back .cam { position: absolute; left: 34px; top: 34px; width: 250px; height: 250px; border-radius: 70px; background: linear-gradient(145deg, #30333c, #1a1c22); box-shadow: inset 0 0 0 3px rgba(255,255,255,0.08); }
  .back .lens { position: absolute; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a4a66 0%, #0b0d14 55%, #000 70%); box-shadow: 0 0 0 9px #2c2f37, 0 0 0 11px #555a64; }
  .back .logo { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0.9; }
  .front { position: absolute; inset: 0; border-radius: 100px; padding: 5px; box-sizing: border-box;
    background: linear-gradient(135deg, #f1f2f5 0%, #8b8e97 18%, #e9eaee 34%, #6f727b 52%, #d8dae0 70%, #7d808a 86%, #eceef2 100%);
    backface-visibility: hidden; }
  .bezel { position: absolute; inset: 5px; border-radius: 95px; background: #050507; }
  .screen { position: absolute; left: 11px; top: 11px; width: 600px; height: 1300px; border-radius: 84px; overflow: hidden; background: #000; }
  .status { position: absolute; left: 0; top: 0; width: 600px; height: 63px; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 6px 46px 0 62px; box-sizing: border-box; font-weight: 600; font-size: 24px; color: #fff; }
  .status .icons { display: flex; gap: 9px; align-items: center; }
  .view { position: absolute; left: 0; top: 0; width: 600px; height: 1300px; }
  .si { position: absolute; left: 0; top: 0; width: 600px; height: 1300px; will-change: transform, opacity; }
  .si .bleed { position: absolute; left: 0; top: 0; width: 600px; height: 64px; background-size: 600px 40000px; background-position: 0 0; }
  .si img { position: absolute; left: 0; top: 63px; width: 600px; height: 1237px; }
  .island { position: absolute; left: 50%; top: 26px; width: 176px; height: 50px; margin-left: -88px; border-radius: 26px; background: #000; z-index: 6; }
  .island::after { content: ''; position: absolute; right: 22px; top: 15px; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #23304a, #05070c 70%); }
  .glare { position: absolute; inset: 0; border-radius: 100px; pointer-events: none; z-index: 7; mix-blend-mode: screen;
    background: linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.10) 44%, rgba(255,255,255,0.02) 52%, rgba(255,255,255,0) 60%);
    background-size: 300% 100%; }
  .btn { position: absolute; width: 8px; border-radius: 4px; background: linear-gradient(90deg, #6e717a, #d9dbe0, #7d808a); }
  .tap { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.9); box-sizing: border-box; opacity: 0; z-index: 8; }
  .tapdot { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: rgba(255,255,255,0.35); opacity: 0; z-index: 8; }
  .pop { position: absolute; background-repeat: no-repeat; backface-visibility: hidden; opacity: 0; will-change: transform, opacity; }
  .pglow { position: absolute; border-radius: 50%; pointer-events: none; }

  .chip { position: absolute; padding: 20px 38px; border-radius: 60px; font-size: 34px; font-weight: 500; white-space: nowrap; color: #fff;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.18); box-shadow: 0 24px 50px rgba(0,0,0,0.45); backdrop-filter: blur(8px); }
  .chip.on { background: linear-gradient(95deg, #1D9FDA, #61A644); border-color: transparent; }

  /* wall */
  #wall { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; }
  .col { position: absolute; top: 0; }
  .tile { position: absolute; left: 0; width: 330px; height: 715px; border-radius: 48px; overflow: hidden; background: #000; box-shadow: 0 0 0 4px #9a9da6, 0 0 0 9px #0a0a0c, 0 40px 80px rgba(0,0,0,0.6); }
  .tile img { position: absolute; left: 0; top: 34px; width: 330px; height: 681px; }

  /* end card */
  #s8 { background: var(--mist); }
  .wordmark { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: -0.02em; color: var(--midnight); line-height: 1; }
  .wordmark .c { display: inline-block; }
  .cta { position: absolute; left: 50%; display: flex; align-items: center; gap: 30px; padding: 26px 46px 26px 38px; border-radius: 28px; background: #0B0C12; color: #fff; white-space: nowrap; overflow: hidden; box-shadow: 0 28px 60px rgba(11,12,18,0.32), 0 8px 18px rgba(11,12,18,0.2); }
  .cta .os { display: flex; gap: 20px; align-items: center; padding-right: 30px; border-right: 2px solid rgba(255,255,255,0.2); }
  .cta svg { width: 54px; height: 54px; fill: #fff; display: block; }
  .cta .ctxt { display: flex; flex-direction: column; line-height: 1.12; }
  .cta small { font-size: 25px; font-weight: 400; color: rgba(255,255,255,0.72); }
  .cta b { font-size: 42px; font-weight: 600; letter-spacing: -0.01em; }
  .mood { position: absolute; display: flex; align-items: center; gap: 26px; font-weight: 500; font-size: 46px; line-height: 60px; color: #fff; white-space: nowrap; will-change: transform, opacity, filter; }
  .mood .bullet { width: 16px; height: 16px; border-radius: 50%; flex: none; background: linear-gradient(135deg, #3DBDF5, #61A644); box-shadow: 0 0 18px rgba(61,189,245,0.75); }
  .mline { position: absolute; width: 2px; background: linear-gradient(180deg, rgba(61,189,245,0.55), rgba(97,166,68,0.35)); transform-origin: top center; }
  .cta .shine { position: absolute; top: -20px; bottom: -20px; width: 140px; background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0)); transform: skewX(-20deg); }

  .gbar { position: absolute; left: 0; mix-blend-mode: normal; }
  #grain { position: absolute; inset: 0; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none; background-size: 360px 360px; }
  #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .streak { position: absolute; top: -600px; width: 520px; height: 3200px; transform: rotate(18deg); pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(160,220,255,0.16) 45%, rgba(255,255,255,0.28) 50%, rgba(160,255,190,0.12) 55%, rgba(255,255,255,0)); }
</style>
</head>
<body>
<div id="stage"><div id="cam"></div></div>
<script src="comp.js"></script>
</body>
</html>
