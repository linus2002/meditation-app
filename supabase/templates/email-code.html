<!--
  The sign-in / sign-up email. Supabase's default template sends a link; the
  app asks for the code instead, so this one prints {{ .Token }}.

  Paste it into Supabase → Authentication → Emails, in BOTH the
  "Confirm signup" template (new accounts) and the "Magic Link" template
  (returning sign-ins). Suggested subject for both: Your Serenity code
-->
<div style="margin:0;padding:32px 16px;background:#0b0b10;font-family:Poppins,Arial,sans-serif;color:#f4f4f6;">
  <div style="max-width:420px;margin:0 auto;padding:32px 24px;background:#16161e;border-radius:20px;text-align:center;">
    <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;">Your Serenity code</h1>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#b9b9c6;">
      Type this code in the app to continue.
    </p>
    <p style="margin:0 0 24px;font-size:34px;font-weight:700;letter-spacing:10px;color:#ffffff;">
      {{ .Token }}
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#8a8a99;">
      It expires in 1 hour. If you didn’t ask for it, you can ignore this email.
    </p>
  </div>
</div>
